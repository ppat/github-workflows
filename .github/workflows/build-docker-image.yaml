---
# yamllint disable rule:line-length
name: build-docker-image

on:
  workflow_call:
    inputs:
      image_context_path:
        required: true
        type: string
      dockerhub_repository:
        type: string
        required: false
      label_title:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      label_description:
        required: false
        type: string
        default: ${{ github.event.repository.description }}
      platforms:
        required: false
        type: string
        # linux/amd64 only: defaulting to a multi-arch pair would silently hand a naive new
        # consumer QEMU-emulated arm64 builds -- images/openclaw hit exactly this trap (arm64
        # blew a 20-minute timeout while amd64 finished in under 2 minutes). Widen explicitly
        # with a `with: platforms: linux/amd64,linux/arm64` once native arm64 build capacity
        # justifies the cost.
        default: linux/amd64
      private_registry_repository:
        required: false
        type: string
      private_registry_build_cache:
        required: false
        type: string
      ghcr_repository:
        required: false
        type: string
      git_ref:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 30
    secrets:
      build_secrets:
        required: false
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false
      private_registry_username:
        required: false
      private_registry_token:
        required: false
      private_registry:
        required: false
      tailscale_oauth_client_id:
        required: false
      tailscale_oauth_secret:
        required: false
    outputs:
      digest:
        value: ${{ jobs.build-image.outputs.digest }}
      image_tag:
        value: ${{ jobs.build-image.outputs.image_tag }}
      image_refs:
        value: ${{ jobs.build-image.outputs.image_refs }}

permissions: {}

jobs:
  build-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      contents: read
      # packages: write is declared unconditionally, not gated on whether this call actually
      # uses GHCR: a job's `permissions:` block accepts no expressions, so it cannot be made
      # conditional. The consequence is not a soft one -- a caller that does not itself grant
      # packages: write gets a hard failure at workflow LOAD, not a clamp to what they granted:
      # zero jobs run, no annotations are produced, only a top-level error of the form:
      #
      #   The nested job 'build-image' is requesting 'packages: write', but is only allowed
      #   'packages: none'.
      #
      # So every caller of this workflow -- including one that never touches GHCR -- must grant
      # packages: write on the job that calls it, or the run never starts. See "Publishing to
      # GHCR" in the README for the full consumer-facing explanation. The same load-time check
      # is why this wrapper does not expose the action's `sign` input: it would need
      # id-token: write from every caller.
      packages: write  # required unconditionally for GHCR; see the comment above and the README

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_refs: ${{ steps.build.outputs.image_refs }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
        repository: ${{ github.repository }}
        ref: ${{ inputs.git_ref }}

    # All build, publish and Tailscale logic lives in the action; this job only supplies what an
    # action cannot own (runner, timeout, permissions, the checkout, and secrets as inputs).
    - name: Build and publish image
      id: build
      uses: ppat/homelab-ops-actions/actions/build-docker-image@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        image_context_path: ${{ inputs.image_context_path }}
        platforms: ${{ inputs.platforms }}
        label_title: ${{ inputs.label_title }}
        label_description: ${{ inputs.label_description }}
        dockerhub_repository: ${{ inputs.dockerhub_repository }}
        ghcr_repository: ${{ inputs.ghcr_repository }}
        private_registry_repository: ${{ inputs.private_registry_repository }}
        private_registry_build_cache: ${{ inputs.private_registry_build_cache }}
        build_secrets: ${{ secrets.build_secrets }}
        dockerhub_username: ${{ secrets.dockerhub_username }}
        dockerhub_token: ${{ secrets.dockerhub_token }}
        private_registry: ${{ secrets.private_registry }}
        private_registry_username: ${{ secrets.private_registry_username }}
        private_registry_token: ${{ secrets.private_registry_token }}
        tailscale_oauth_client_id: ${{ secrets.tailscale_oauth_client_id }}
        tailscale_oauth_secret: ${{ secrets.tailscale_oauth_secret }}
