---
# yamllint disable rule:line-length
name: build-docker-image

on:
  workflow_call:
    inputs:
      image_context_path:
        required: true
        type: string
      dockerhub_repository:
        type: string
        required: false
      label_title:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      label_description:
        required: false
        type: string
        default: ${{ github.event.repository.description }}
      platforms:
        required: false
        type: string
        # linux/amd64 only: defaulting to a multi-arch pair would silently hand a naive new
        # consumer QEMU-emulated arm64 builds -- images/openclaw hit exactly this trap (arm64
        # blew a 20-minute timeout while amd64 finished in under 2 minutes). Widen explicitly
        # with a `with: platforms: linux/amd64,linux/arm64` once native arm64 build capacity
        # justifies the cost.
        default: linux/amd64
      private_registry_repository:
        required: false
        type: string
      private_registry_build_cache:
        required: false
        type: string
      ghcr_repository:
        required: false
        type: string
      git_ref:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 30
    secrets:
      build_secrets:
        required: false
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false
      private_registry_username:
        required: false
      private_registry_token:
        required: false
      private_registry:
        required: false
      tailscale_oauth_client_id:
        required: false
      tailscale_oauth_secret:
        required: false
    outputs:
      digest:
        value: ${{ jobs.build-image.outputs.digest }}
      image_tag:
        value: ${{ jobs.build-image.outputs.image_tag }}
      image_refs:
        value: ${{ jobs.build-image.outputs.image_refs }}

permissions: {}

env:
  PUBLISH_DOCKERHUB: ${{ inputs.dockerhub_repository != '' && secrets.dockerhub_username != '' && secrets.dockerhub_token != '' }}
  PUBLISH_PRIVATE_REGISTRY: ${{ secrets.private_registry != '' && inputs.private_registry_repository != '' && secrets.private_registry_username != '' && secrets.private_registry_token != '' }}
  # GHCR authenticates with the ambient GITHUB_TOKEN (github.actor / github.token), not
  # caller-supplied credentials -- unlike the other two targets, it has no secrets of its own.
  # That's why it keys on the repository input alone: see the job `permissions:` below for why
  # `packages: write` is declared unconditionally on this job, and "Publishing to GHCR" in the
  # README for what that costs every caller.
  PUBLISH_GHCR: ${{ inputs.ghcr_repository != '' }}
  # Computed once so `push:`/`sbom:`/`provenance:` (and anything added later) all answer "is
  # anything being published at all" from one place, instead of each repeating
  # `PUBLISH_DOCKERHUB == 'true' || PUBLISH_PRIVATE_REGISTRY == 'true' || PUBLISH_GHCR == 'true'` verbatim.
  PUBLISH_ANY: ${{ (inputs.dockerhub_repository != '' && secrets.dockerhub_username != '' && secrets.dockerhub_token != '') || (secrets.private_registry != '' && inputs.private_registry_repository != '' && secrets.private_registry_username != '' && secrets.private_registry_token != '') || (inputs.ghcr_repository != '') }}
  CONNECT_TAILSCALE: ${{ secrets.tailscale_oauth_client_id != '' && secrets.tailscale_oauth_secret != '' }}
  REF_KIND: ''
  VERSION_SEMVER: ''
  VERSION_RAW: ''
  VERSION_SHA: ''
  CACHE_FROM: ''
  CACHE_TO: ''

jobs:
  build-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      contents: read
      # packages: write is declared unconditionally, not gated on whether this call actually
      # uses GHCR: a job's `permissions:` block accepts no expressions, so it cannot be made
      # conditional. The consequence is not a soft one -- a caller that does not itself grant
      # packages: write gets a hard failure at workflow LOAD, not a clamp to what they granted:
      # zero jobs run, no annotations are produced, only a top-level error of the form:
      #
      #   The nested job 'build-image' is requesting 'packages: write', but is only allowed
      #   'packages: none'.
      #
      # So every caller of this workflow -- including one that never touches GHCR -- must grant
      # packages: write on the job that calls it, or the run never starts. See "Publishing to
      # GHCR" in the README for the full consumer-facing explanation.
      packages: write  # required unconditionally for GHCR; see the comment above and the README

    outputs:
      digest: ${{ steps.image_info.outputs.digest }}
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_refs: ${{ steps.image_info.outputs.image_refs }}

    steps:
    - name: Validate publish target configuration
      shell: bash
      env:
        DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub_repository }}
        DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
        DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
        PRIVATE_REGISTRY: ${{ secrets.private_registry }}
        PRIVATE_REGISTRY_REPOSITORY: ${{ inputs.private_registry_repository }}
        PRIVATE_REGISTRY_USERNAME: ${{ secrets.private_registry_username }}
        PRIVATE_REGISTRY_TOKEN: ${{ secrets.private_registry_token }}
        GHCR_REPOSITORY: ${{ inputs.ghcr_repository }}
        TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.tailscale_oauth_client_id }}
        TAILSCALE_OAUTH_SECRET: ${{ secrets.tailscale_oauth_secret }}
        # The `github` context of a called (workflow_call) workflow is the same context the
        # caller's job graph runs under -- it's the same run, not a separate event -- so this
        # correctly reflects the ORIGINAL triggering event even one workflow_call hop up (e.g.
        # ppat/images' release-workflow.yaml calling this one). On a non-pull_request run,
        # github.event.pull_request is unset and this evaluates to `false`, not an error.
        FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
      # yamllint disable-line rule:indentation
      run: |
        # One rule, applied identically to all three targets, keyed on the *repository* input
        # -- not on credentials -- since a repository can be requested independently of
        # whether its credentials happen to be configured.
        #
        #   requested = repository input is non-empty AND well-formed (no leading/trailing
        #   '/', no empty path segment). A caller commonly builds this input by interpolating
        #   an org/repo variable in front of a literal path segment (a bare vars-context
        #   value, followed by "/name"), which resolves to a genuinely malformed "/name" when
        #   that variable is unset -- e.g. on a fork PR, where organization variables are
        #   withheld the same way secrets are.
        #   Rejecting that shape as malformed (treated as unset, with a warning) is a real
        #   well-formedness check, not a fork heuristic -- it fires the same way regardless of
        #   event type. Deep paths like `library/team/name` remain valid.
        #
        #   requested && credentials missing -> error and fail, UNLESS this is a fork PR (only
        #   then are credentials legitimately withheld rather than simply forgotten) -- warn
        #   and disable the target instead.
        #   requested && credentials complete -> target on, nothing to report.
        #   !requested && credentials complete -> WARNING, not error: a caller that inherits
        #   org-level credentials it doesn't intend to use (a `secrets: inherit` block pulling
        #   in e.g. an org DOCKERHUB_TOKEN) is not misconfigured -- passing unused credentials
        #   is harmless, and the repository input alone is the request signal.
        #   !requested && credentials missing -> target simply disabled. Warn, don't fail.
        #   partial credentials (some but not all) -> always an unambiguous misconfiguration,
        #   independent of `requested`; fail before any expensive setup runs.
        #
        # Docker Hub and the private registry declare a non-empty credential set (creds_total
        # 2 and 3 below); GHCR does not -- it authenticates with the ambient GITHUB_TOKEN, not
        # a credential pair of its own, so it's called with creds_set=0, creds_total=0. Walk
        # check_target's branches at that specific point, since a wrong branch here means an
        # error for every consumer that doesn't use GHCR:
        #   - partial (creds_set>0 && creds_set<creds_total): needs creds_set>0, impossible
        #     when creds_set is always 0 -- can never fire.
        #   - requested && creds missing (requested==1 && creds_set<creds_total): 0<0 is
        #     false -- can never fire, so a requested GHCR with no credentials is not an error.
        #   - !requested && creds "complete" (requested==0 && creds_total>0 && ...): guarded by
        #     creds_total>0, which is false here -- can never fire ("vacuous complete" is
        #     exactly what this guard exists to block).
        #   - !requested && creds_set==0: the only branch reachable at creds_total=0. Fires
        #     the ordinary "not configured" warning when GHCR isn't requested, same as any
        #     other unrequested target.
        # This mirrors env.PUBLISH_DOCKERHUB / env.PUBLISH_PRIVATE_REGISTRY / env.PUBLISH_GHCR /
        # env.PUBLISH_ANY, computed once above from these same fields; the zero-targets check
        # at the bottom reads those rather than recomputing a second notion of "is this target
        # on".
        fail=0

        is_malformed_repo() {
          [[ "$1" =~ ^/|/$|// ]]
        }

        check_target() {
          local name="$1" repo="$2" creds_label="$3" creds_set="$4" creds_total="$5"

          local requested=0
          if [[ -z "$repo" ]]; then
            requested=0
          elif is_malformed_repo "$repo"; then
            echo "::warning::${name}: repository '${repo}' is malformed (a leading/trailing '/', or an empty path segment) -- treating it as unset."
            requested=0
          else
            requested=1
          fi

          if [[ "$creds_set" -gt 0 && "$creds_set" -lt "$creds_total" ]]; then
            echo "::error::${name} is partially configured: ${creds_label} must all be set together, or none of them."
            fail=1
          elif [[ "$requested" -eq 1 && "$creds_set" -lt "$creds_total" ]]; then
            if [[ "$FORK_PR" == 'true' ]]; then
              echo "::warning::${name}: repository is set but credentials (${creds_label}) are withheld on a fork PR -- disabling ${name} for this run."
            else
              echo "::error::${name}: repository is set but credentials (${creds_label}) are not configured."
              fail=1
            fi
          elif [[ "$requested" -eq 0 && "$creds_total" -gt 0 && "$creds_set" -eq "$creds_total" ]]; then
            echo "::warning::${name}: credentials (${creds_label}) are configured but its repository is empty or malformed -- publish is disabled for this run. If these credentials were inherited (e.g. \`secrets: inherit\`) rather than deliberately set for ${name}, this is expected and harmless."
          elif [[ "$requested" -eq 0 && "$creds_set" -eq 0 ]]; then
            echo "::warning::${name} is not configured (repository and credentials both unset) -- publish is disabled for this run."
          fi
        }

        dockerhub_creds_set=0
        for field in "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN"; do
          [[ -n "$field" ]] && dockerhub_creds_set=$((dockerhub_creds_set + 1))
        done
        check_target "Docker Hub" "$DOCKERHUB_REPOSITORY" "dockerhub_username / dockerhub_token" "$dockerhub_creds_set" 2

        private_registry_creds_set=0
        for field in "$PRIVATE_REGISTRY" "$PRIVATE_REGISTRY_USERNAME" "$PRIVATE_REGISTRY_TOKEN"; do
          [[ -n "$field" ]] && private_registry_creds_set=$((private_registry_creds_set + 1))
        done
        check_target "Private registry" "$PRIVATE_REGISTRY_REPOSITORY" "private_registry / private_registry_username / private_registry_token" "$private_registry_creds_set" 3

        # GHCR authenticates with the ambient GITHUB_TOKEN (see the PUBLISH_GHCR comment above
        # and the job `permissions:` block), not a credential pair of its own -- unlike the
        # other two targets, it has no username/token secrets to check here at all.
        #
        # GHCR rejects uppercase repository references outright, so lowercase it here (mirroring
        # GitHub's own `tr '[A-Z]' '[a-z]'` guidance) before it's used anywhere -- both in this
        # target's own requested-check and in the "Docker meta" step's `images:` list -- rather
        # than hard-failing on what is usually just an image name that happens to share casing
        # with a GitHub repository name. Exported via GITHUB_ENV since GitHub Actions expression
        # syntax has no lower-casing function; `env.GHCR_REPOSITORY_LOWER` is what later steps
        # read.
        ghcr_repository_lower="$(printf '%s' "$GHCR_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        if [[ "$ghcr_repository_lower" != "$GHCR_REPOSITORY" ]]; then
          echo "::warning::GHCR: repository '${GHCR_REPOSITORY}' contains uppercase characters -- GHCR requires a lowercase path; normalizing to '${ghcr_repository_lower}'."
        fi
        echo "GHCR_REPOSITORY_LOWER=${ghcr_repository_lower}" >> "$GITHUB_ENV"

        # creds_set=0, creds_total=0: GHCR has no credentials of its own to be partial or
        # missing about -- see the branch-by-branch walk in the comment above check_target.
        check_target "GHCR" "$ghcr_repository_lower" "" 0 0

        # Tailscale is a precondition for the private registry (a Tailnet-only host): apply the
        # same all-or-nothing rule to its OAuth pair so a half-configured Tailscale fails fast
        # here instead of silently disabling the build cache and then failing late at
        # "Login to Private Registry" with no tunnel up.
        tailscale_creds_set=0
        for field in "$TAILSCALE_OAUTH_CLIENT_ID" "$TAILSCALE_OAUTH_SECRET"; do
          [[ -n "$field" ]] && tailscale_creds_set=$((tailscale_creds_set + 1))
        done
        if [[ "$tailscale_creds_set" -gt 0 && "$tailscale_creds_set" -lt 2 ]]; then
          echo "::error::Tailscale is partially configured: tailscale_oauth_client_id and tailscale_oauth_secret secrets must both be set together, or neither."
          fail=1
        elif [[ "$tailscale_creds_set" -eq 0 ]]; then
          echo "::warning::Tailscale credentials (tailscale_oauth_client_id / tailscale_oauth_secret) are not configured -- Tailscale connectivity, and anything depending on it (the private registry build cache, a Tailnet-only registry login), is disabled for this run."
        fi

        if [[ "$PUBLISH_ANY" != 'true' ]]; then
          echo "::warning::No publish target is configured (Docker Hub, private registry, and GHCR are all disabled) -- this will be a build-only run that publishes nothing."
        fi

        exit "$fail"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
        repository: ${{ github.repository }}
        ref: ${{ inputs.git_ref }}


    - name: Resolve git ref
      shell: bash
      env:
        GIT_REF: ${{ inputs.git_ref }}
      # yamllint disable-line rule:indentation
      run: |
        # Ask the repository actions/checkout just populated what git_ref actually
        # resolved to, instead of guessing from the input string's shape (the previous
        # startsWith(..., 'refs/') check). A pure string guess misclassifies a bare tag name
        # (e.g. a consumer passing github.ref_name on a tag push, unqualified) as a branch --
        # VERSION_SEMVER stays empty and the release publishes as branch-<name> with no
        # semver/latest tags -- and leaves a ref that is neither (refs/pull/N/merge) matching
        # nothing at all, so VERSION_RAW/VERSION_SEMVER stay empty and metadata-action applies
        # its prefixes to nothing, pushing the literal tags "branch-" and "git-".
        #
        # actions/checkout (fetch-depth: 1, ref: git_ref, no sha:) only ever leaves a
        # successful checkout in one of two states (verified against its ref-helper.ts): HEAD
        # on a local branch -- `checkout -B <branch> <startpoint>`, used both for a
        # fully-qualified refs/heads/<x> and for a bare name that matches a remote branch,
        # which is also the priority actions/checkout itself gives a bare name matching both a
        # branch and a tag -- or HEAD detached at a fetched tag ref -- `checkout
        # refs/tags/<x>`, used both for a fully-qualified refs/tags/<x> and for a bare name
        # that only matches a tag. Anything else (refs/pull/N/merge, an arbitrary
        # refs/<other>/<x>) leaves HEAD detached with no tag pointing at it, which is exactly
        # the case that used to slip through as blank VERSION_RAW/VERSION_SEMVER -- fail loudly
        # instead of publishing garbage tags.
        branch="$(git symbolic-ref -q --short HEAD || true)"

        if [[ -n "$branch" ]]; then
          ref_kind=branch
          # use the git ref segment after the final slash (a branch name can contain a slash)
          version_raw="$(echo "$branch" | grep -oE '[^/]+$' | sed -E 's/[^a-zA-Z0-9]+/-/g; s/(^-+)|(-+$)//g')"
          version_semver=""
        else
          # --exact-match only requires a tag ref pointing at HEAD's commit, not full history,
          # so this is safe under actions/checkout's fetch-depth: 1.
          tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ -n "$tag" ]]; then
            ref_kind=tag
            # use the git ref segment after the final slash (a tag name can contain a slash)
            version_raw="$(echo "$tag" | grep -oE '[^/]+$')"
            # A non-semver tag (nightly, rc1, a date stamp) is legitimate and yields an empty
            # version_semver, not a failure: grep exits 1 on no match, and under bash's default
            # `-eo pipefail` that would otherwise kill this step outright. The trailing
            # `|| true` sits after the whole pipeline (not inside it) so it absorbs that
            # exit status regardless of which stage produced it.
            version_semver="$(echo "$version_raw" | grep -o -E '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          else
            echo "::error::git_ref '$GIT_REF' resolved to neither a branch nor a tag after checkout (detached HEAD, no tag points at it) -- refusing to publish an image with an unclassifiable version."
            exit 1
          fi
        fi

        version_sha="$(git rev-parse --short HEAD)"

        set -x
        {
          echo "REF_KIND=$ref_kind"
          echo "VERSION_SEMVER=$version_semver"
          echo "VERSION_RAW=$version_raw"
          echo "VERSION_SHA=$version_sha"
        } >> "$GITHUB_ENV"

    - name: Automatically set image build cache parameters
      shell: bash
      env:
        PRIVATE_REGISTRY_BUILD_CACHE: ${{ inputs.private_registry_build_cache }}
        IMAGE_CACHE: ${{ secrets.private_registry }}/${{ inputs.private_registry_build_cache }}
        CACHE_PARAMS: image-manifest=true,oci-mediatypes=true,mode=max,compression=zstd
      # yamllint disable-line rule:indentation
      run: |
        # Guard on private_registry_build_cache directly: IMAGE_CACHE always contains a
        # literal "/" (it's secrets.private_registry + "/" + this input), so it can never be
        # empty even when the input itself is unset -- that made this guard dead.
        #
        # No CONNECT_TAILSCALE check here: the cache lives in the same registry the private
        # registry target logs into, so if that host is reachable, so is the cache -- and if
        # it isn't, "Login to Private Registry" fails first and loudly, well before caching
        # matters. Gating on Tailscale here instead silently dropped layer caching for any
        # consumer whose private registry happens to be reachable without it, while printing a
        # message claiming no cache repository was specified, which was false.
        if [[ -z "$PRIVATE_REGISTRY_BUILD_CACHE" || "$PUBLISH_PRIVATE_REGISTRY" != 'true' ]]; then
          echo "No repository for docker build cache specified, disabling build cache all together."
          CACHE_FROM=""
          CACHE_TO=""
        else
          LAST_COMMIT_MSG=$(git log --oneline --no-merges -1)
          BUST_CACHE=false
          # shellcheck disable=SC2076  # literal substring match is intended; unquoting would make [ci: bust-cache] a regex character class
          if [[ "$LAST_COMMIT_MSG" =~ "[ci: bust-cache]" ]]; then
            echo "Instruction to bust cache detected in commit message."
            echo "Disabling use of cache for the build. This build itself will still be cached."
            BUST_CACHE=true
          fi

          # Only two caches exist: :branch-<name> (this branch's last build) and :cache-latest
          # (the last build of anything, on either a branch or a tag). Use REF_KIND, not
          # VERSION_SEMVER emptiness, as the single answer to "what kind of ref is this" -- a
          # non-semver tag also has an empty VERSION_SEMVER, and treating it like a branch here
          # would import/export a bogus :branch-<tag-name> cache ref.
          if [[ "$BUST_CACHE" == 'true' ]]; then
            CACHE_FROM=""
          elif [[ "$REF_KIND" == 'branch' ]]; then
            echo "Setting cache-from to use current branch and last build of any branch or tag as caches..."
            CACHE_FROM=$(printf 'type=registry,ref=%s:branch-%s\ntype=registry,ref=%s:cache-latest' \
              "$IMAGE_CACHE" "$VERSION_RAW" "$IMAGE_CACHE")
          else
            echo "Setting cache-from to use last build of any branch or tag as cache..."
            CACHE_FROM=$(printf 'type=registry,ref=%s:cache-latest' "$IMAGE_CACHE")
          fi

          if [[ "$REF_KIND" == 'tag' ]]; then
            # Tag builds only ever refresh cache-latest -- never clobber a branch cache with a
            # point-in-time release build.
            echo "Setting cache-to to push to cache-latest only (tag build)..."
            CACHE_TO=$(printf 'type=registry,ref=%s:cache-latest,%s' "$IMAGE_CACHE" "$CACHE_PARAMS")
          else
            echo "Setting cache-to to push to branch cache..."
            CACHE_TO=$(printf 'type=registry,ref=%s:branch-%s,%s\ntype=registry,ref=%s:cache-latest,%s' \
              "$IMAGE_CACHE" "$VERSION_RAW" "$CACHE_PARAMS" "$IMAGE_CACHE" "$CACHE_PARAMS")
          fi
        fi

        set -x
        {
          echo "CACHE_FROM<<CACHE_FROM_EOF"
          echo "$CACHE_FROM"
          echo "CACHE_FROM_EOF"
          echo "CACHE_TO<<CACHE_TO_EOF"
          echo "$CACHE_TO"
          echo "CACHE_TO_EOF"
        } >> "$GITHUB_ENV"

    - name: Show build parameters
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        # `env | grep` is line-based and would only show the first ref of each multi-line
        # CACHE_FROM / CACHE_TO value (they're deliberately newline-separated -- see "Automatically
        # set image build cache parameters" -- since docker/build-push-action's Util.getInputList
        # only splits cache-from/cache-to on newlines). Print each variable explicitly instead so
        # every ref is visible; this step exists to make cache plumbing auditable.
        for var in VERSION_RAW VERSION_SEMVER VERSION_SHA CACHE_FROM CACHE_TO; do
          echo "=== $var ==="
          echo "${!var}"
        done

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        buildkitd-flags: '--debug --allow-insecure-entitlement=network.host'
        driver-opts: network=host
        platforms: ${{ inputs.platforms }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |-
          ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' && format('{0}/{1}', secrets.private_registry, inputs.private_registry_repository) || '' }}
          ${{ env.PUBLISH_DOCKERHUB == 'true' && inputs.dockerhub_repository || '' }}
          ${{ env.PUBLISH_GHCR == 'true' && format('ghcr.io/{0}', env.GHCR_REPOSITORY_LOWER) || '' }}
        labels: |
          org.opencontainers.image.title=${{ inputs.label_title }}
          org.opencontainers.image.description=${{ inputs.label_description }}
          org.opencontainers.image.version=${{ env.VERSION_RAW }}
        annotations: |
          org.opencontainers.image.title=${{ inputs.label_title }}
          org.opencontainers.image.description=${{ inputs.label_description }}
          org.opencontainers.image.version=${{ env.VERSION_RAW }}
        tags: |-
          type=raw,value=${{ env.VERSION_RAW }},enable=${{ env.REF_KIND == 'tag' }},priority=1000
          type=semver,pattern={{version}},value=${{ env.VERSION_SEMVER }},enable=${{ env.VERSION_SEMVER != '' }},priority=900
          type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION_SEMVER }},enable=${{ env.VERSION_SEMVER != '' }},priority=800
          type=semver,pattern={{major}},value=${{ env.VERSION_SEMVER }},enable=${{ env.VERSION_SEMVER != '' }},priority=700
          type=raw,value=latest,enable=${{ env.VERSION_SEMVER != '' }},priority=200
          type=raw,value=${{ env.VERSION_RAW }},enable=${{ env.REF_KIND == 'branch' }},prefix=branch-,priority=400
          type=raw,value=${{ env.VERSION_SHA }},prefix=git-,priority=300

    - name: Tailscale Connect
      if: ${{ env.CONNECT_TAILSCALE == 'true' }}
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ secrets.tailscale_oauth_client_id }}
        oauth-secret: ${{ secrets.tailscale_oauth_secret }}
        tags: tag:github-action-ci-runner

    - name: Tailscale Debug
      if: ${{ env.CONNECT_TAILSCALE == 'true' && github.event_name == 'workflow_dispatch' }}
      # Debug scaffolding, load-bearing on nothing: `tailscale ping` legitimately fails for a
      # host behind a subnet router, and under bash's default -eo pipefail that would kill the
      # job before the build ever ran. continue-on-error keeps a flaky diagnostic step from
      # failing a build that would otherwise have succeeded.
      continue-on-error: true
      env:
        PRIVATE_REGISTRY: ${{ secrets.private_registry }}
      # yamllint disable-line rule:indentation
      run: |
        # .github/.output-filter is read from the CALLER's checkout (this is a reusable
        # workflow), so it is intentionally honoured when a consumer provides one, but must
        # not be required: GNU sed exits 4 on a missing script file, which would otherwise
        # fail this step's whole job for every consumer that doesn't ship one. Degrade to an
        # unfiltered passthrough instead -- this step is debug scaffolding, not something with
        # a correctness requirement beyond "runs and prints".
        output_filter() {
          if [[ -f .github/.output-filter ]]; then
            sed -f .github/.output-filter
          else
            cat
          fi
        }

        sudo -E tailscale netcheck --verbose 2>&1 | output_filter
        echo "------------------------------------------------------------------------------"
        sudo -E tailscale status 2>&1 | output_filter
        echo "------------------------------------------------------------------------------"
        sudo -E tailscale status --json --peers=false 2>&1 | output_filter
        echo "------------------------------------------------------------------------------"
        sudo tailscale dns status --all
        echo "------------------------------------------------------------------------------"
        # Only ping the private registry when it's actually a publish target: this runs
        # whenever Tailscale is connected regardless of whether the private registry is on,
        # and pinging an empty argument (target disabled) is pointless as well as noisy.
        if [[ "$PUBLISH_PRIVATE_REGISTRY" == 'true' ]]; then
          sudo -E tailscale ping --verbose --until-direct=false --c 5 "$PRIVATE_REGISTRY" | output_filter
          echo "------------------------------------------------------------------------------"
        fi

    - name: Login to Docker Hub
      if: ${{ env.PUBLISH_DOCKERHUB == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.dockerhub_username }}
        password: ${{ secrets.dockerhub_token }}

    - name: Login to Private Registry
      if: ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ secrets.private_registry }}
        username: ${{ secrets.private_registry_username }}
        password: ${{ secrets.private_registry_token }}

    - name: Login to GHCR
      if: ${{ env.PUBLISH_GHCR == 'true' }}
      # Ambient GITHUB_TOKEN, not a caller-supplied secret: this job declares `packages: write`
      # unconditionally (see the job `permissions:` block above), so github.token here already
      # carries package-write scope. A caller-forwarded `secrets.GITHUB_TOKEN` was tried first
      # and empirically does NOT work -- docker/login-action succeeds (it only validates token
      # form) but the subsequent push 403s with "denied: installation not allowed to Write
      # organization package". GHCR authorizes against the permissions of the job that executes
      # the push, not whatever job a token string was minted in, so the token must come from
      # this job's own ambient permissions -- see "Publishing to GHCR" in the README.
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and publish image
      id: build-image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ./${{ inputs.image_context_path }}
        platforms: ${{ inputs.platforms }}
        load: false
        push: ${{ env.PUBLISH_ANY == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}
        sbom: ${{ env.PUBLISH_ANY == 'true' }}
        provenance: ${{ env.PUBLISH_ANY == 'true' }}
        secrets: ${{ secrets.build_secrets }}

    - name: Prepare job outputs from image build
      id: image_info
      shell: bash
      env:
        IMAGE_TAG: ${{ steps.meta.outputs.version }}
        IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        IMAGE_REFS: ${{ steps.meta.outputs.tags }}
      # yamllint disable-line rule:indentation
      run: |
        # A build-only run (zero publish targets) is a green run by design, and in that case
        # digest is legitimately empty -- there's nothing pushed to have a digest. But if
        # PUBLISH_ANY is true, an empty digest here means the build silently produced nothing
        # publishable, which a consumer keying off this output (e.g. `docker run ...@$digest`)
        # would otherwise fail against obscurely, well after this job reported green.
        if [[ "$PUBLISH_ANY" == 'true' && -z "$IMAGE_DIGEST" ]]; then
          echo "::error::A publish target is enabled but the build produced no digest."
          exit 1
        fi

        {
          echo "digest=${IMAGE_DIGEST}"
          echo "image_tag=${IMAGE_TAG}"
          echo "image_refs<<IMAGE_REFS_EOF"
          echo "${IMAGE_REFS}"
          echo "IMAGE_REFS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Truncate Docker Hub short description
      id: dockerhub_meta
      if: ${{ env.PUBLISH_DOCKERHUB == 'true' }}
      shell: bash
      env:
        LABEL_DESCRIPTION: ${{ inputs.label_description }}
      # yamllint disable-line rule:indentation
      run: |
        # Docker Hub caps short-description at 100 characters server-side; label_description
        # is free text meant for OCI image labels, which have no such limit, so the two can
        # silently diverge -- images/obsidian and images/openclaw both sit at 96 characters
        # today, one word away from red-lighting a run whose image published fine.
        echo "short_description=${LABEL_DESCRIPTION:0:100}" >> "$GITHUB_OUTPUT"

    - name: Docker Hub Description
      if: ${{ env.PUBLISH_DOCKERHUB == 'true' }}
      # This is an announcement bolted on after the push already succeeded, with failure modes
      # nobody declared as a dependency: readme-filepath must exist, and short-description
      # (truncated above, but still) is otherwise at the mercy of Docker Hub's API. Don't let
      # either fail a build that already published.
      continue-on-error: true
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: ${{ secrets.dockerhub_username }}
        password: ${{ secrets.dockerhub_token }}
        repository: ${{ inputs.dockerhub_repository }}
        readme-filepath: ./${{ inputs.image_context_path }}/README.md
        short-description: ${{ steps.dockerhub_meta.outputs.short_description }}
        enable-url-completion: true

    - name: Tailscale Disconnect
      if: ${{ (success() || failure()) && (env.CONNECT_TAILSCALE == 'true') }}
      run: sudo -E tailscale logout
