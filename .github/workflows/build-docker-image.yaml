---
# yamllint disable rule:line-length
name: build-docker-image

on:
  workflow_call:
    inputs:
      image_context_path:
        required: true
        type: string
      dockerhub_repository:
        type: string
        required: false
      label_title:
        required: true
        type: string
      label_description:
        required: true
        type: string
      platforms:
        required: true
        type: string
      private_registry_repository:
        required: false
        type: string
      private_registry_build_cache:
        required: false
        type: string
      source_git_ref:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
    secrets:
      build_secrets:
        required: false
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false
      private_registry_username:
        required: false
      private_registry_token:
        required: false
      private_registry:
        required: false
      tailscale_oauth_client_id:
        required: false
      tailscale_oauth_secret:
        required: false
    outputs:
      digest:
        value: ${{ jobs.build-image.outputs.digest }}
      image_id:
        value: ${{ jobs.build-image.outputs.image_id }}
      image_tag:
        value: ${{ jobs.build-image.outputs.image_tag }}

permissions: {}

env:
  PUBLISH_DOCKERHUB: ${{ inputs.dockerhub_repository != '' && secrets.dockerhub_username != '' && secrets.dockerhub_token != '' }}
  PUBLISH_PRIVATE_REGISTRY: ${{ secrets.private_registry != '' && inputs.private_registry_repository != '' && secrets.private_registry_username != '' && secrets.private_registry_token != '' }}
  CONNECT_TAILSCALE: ${{ secrets.tailscale_oauth_client_id != '' && secrets.tailscale_oauth_secret != '' }}
  REF_KIND: ''
  VERSION_SEMVER: ''
  VERSION_RAW: ''
  VERSION_SHA: ''
  CACHE_FROM: ''
  CACHE_TO: ''

jobs:
  build-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      contents: read

    outputs:
      digest: ${{ steps.image_info.outputs.digest }}
      image_id: ${{ steps.image_info.outputs.image_id }}
      image_tag: ${{ steps.image_info.outputs.image_tag }}

    steps:
    - name: Validate publish target configuration
      shell: bash
      env:
        DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub_repository }}
        DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
        DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
        PRIVATE_REGISTRY: ${{ secrets.private_registry }}
        PRIVATE_REGISTRY_REPOSITORY: ${{ inputs.private_registry_repository }}
        PRIVATE_REGISTRY_USERNAME: ${{ secrets.private_registry_username }}
        PRIVATE_REGISTRY_TOKEN: ${{ secrets.private_registry_token }}
      # yamllint disable-line rule:indentation
      run: |
        # Each publish target is all-or-nothing: its repository input and every one of its
        # credential secrets must be set together, or none of them. A target that is only
        # partially configured is silently disabled today (see env.PUBLISH_DOCKERHUB /
        # env.PUBLISH_PRIVATE_REGISTRY above), which produces a green job that publishes
        # nothing and gives no indication why. Fail loudly here instead, before any expensive
        # setup runs.
        fail=0

        dockerhub_fields_set=0
        for field in "$DOCKERHUB_REPOSITORY" "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN"; do
          [[ -n "$field" ]] && dockerhub_fields_set=$((dockerhub_fields_set + 1))
        done
        if [[ "$dockerhub_fields_set" -gt 0 && "$dockerhub_fields_set" -lt 3 ]]; then
          echo "::error::Docker Hub is partially configured: dockerhub_repository input plus dockerhub_username and dockerhub_token secrets must all be set together, or none of them."
          fail=1
        fi

        private_registry_fields_set=0
        for field in "$PRIVATE_REGISTRY" "$PRIVATE_REGISTRY_REPOSITORY" "$PRIVATE_REGISTRY_USERNAME" "$PRIVATE_REGISTRY_TOKEN"; do
          [[ -n "$field" ]] && private_registry_fields_set=$((private_registry_fields_set + 1))
        done
        if [[ "$private_registry_fields_set" -gt 0 && "$private_registry_fields_set" -lt 4 ]]; then
          echo "::error::Private registry is partially configured: the private_registry secret, private_registry_repository input, and private_registry_username / private_registry_token secrets must all be set together, or none of them."
          fail=1
        fi

        if [[ "$PUBLISH_DOCKERHUB" != 'true' && "$PUBLISH_PRIVATE_REGISTRY" != 'true' ]]; then
          echo "::error::No publish target resolved (Docker Hub and private registry are both unconfigured or misconfigured) -- this build would publish nothing."
          fail=1
        fi

        exit "$fail"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
        repository: ${{ github.repository }}
        ref: ${{ inputs.source_git_ref }}


    - name: Resolve git ref
      shell: bash
      env:
        SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
      # yamllint disable-line rule:indentation
      run: |
        # Ask the repository actions/checkout just populated what source_git_ref actually
        # resolved to, instead of guessing from the input string's shape (the previous
        # startsWith(..., 'refs/') check). A pure string guess misclassifies a bare tag name
        # (e.g. a consumer passing github.ref_name on a tag push, unqualified) as a branch --
        # VERSION_SEMVER stays empty and the release publishes as branch-<name> with no
        # semver/latest tags -- and leaves a ref that is neither (refs/pull/N/merge) matching
        # nothing at all, so VERSION_RAW/VERSION_SEMVER stay empty and metadata-action applies
        # its prefixes to nothing, pushing the literal tags "branch-" and "git-".
        #
        # actions/checkout (fetch-depth: 1, ref: source_git_ref, no sha:) only ever leaves a
        # successful checkout in one of two states (verified against its ref-helper.ts): HEAD
        # on a local branch -- `checkout -B <branch> <startpoint>`, used both for a
        # fully-qualified refs/heads/<x> and for a bare name that matches a remote branch,
        # which is also the priority actions/checkout itself gives a bare name matching both a
        # branch and a tag -- or HEAD detached at a fetched tag ref -- `checkout
        # refs/tags/<x>`, used both for a fully-qualified refs/tags/<x> and for a bare name
        # that only matches a tag. Anything else (refs/pull/N/merge, an arbitrary
        # refs/<other>/<x>) leaves HEAD detached with no tag pointing at it, which is exactly
        # the case that used to slip through as blank VERSION_RAW/VERSION_SEMVER -- fail loudly
        # instead of publishing garbage tags.
        branch="$(git symbolic-ref -q --short HEAD || true)"

        if [[ -n "$branch" ]]; then
          ref_kind=branch
          # use the git ref segment after the final slash (a branch name can contain a slash)
          version_raw="$(echo "$branch" | grep -oE '[^/]+$' | sed -E 's/[^a-zA-Z0-9]+/-/g; s/(^-+)|(-+$)//g')"
          version_semver=""
        else
          # --exact-match only requires a tag ref pointing at HEAD's commit, not full history,
          # so this is safe under actions/checkout's fetch-depth: 1.
          tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ -n "$tag" ]]; then
            ref_kind=tag
            # use the git ref segment after the final slash (a tag name can contain a slash)
            version_raw="$(echo "$tag" | grep -oE '[^/]+$')"
            version_semver="$(echo "$version_raw" | grep -o -E '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          else
            echo "::error::source_git_ref '$SOURCE_GIT_REF' resolved to neither a branch nor a tag after checkout (detached HEAD, no tag points at it) -- refusing to publish an image with an unclassifiable version."
            exit 1
          fi
        fi

        version_sha="$(git rev-parse --short HEAD)"

        set -x
        {
          echo "REF_KIND=$ref_kind"
          echo "VERSION_SEMVER=$version_semver"
          echo "VERSION_RAW=$version_raw"
          echo "VERSION_SHA=$version_sha"
        } >> "$GITHUB_ENV"

    - name: Automatically set image build cache parameters
      shell: bash
      env:
        PRIVATE_REGISTRY_BUILD_CACHE: ${{ inputs.private_registry_build_cache }}
        IMAGE_CACHE: ${{ secrets.private_registry }}/${{ inputs.private_registry_build_cache }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CACHE_PARAMS: image-manifest=true,oci-mediatypes=true,mode=max,compression=zstd
      # yamllint disable-line rule:indentation
      run: |
        # Guard on private_registry_build_cache directly: IMAGE_CACHE always contains a
        # literal "/" (it's secrets.private_registry + "/" + this input), so it can never be
        # empty even when the input itself is unset -- that made this guard dead.
        if [[ -z "$PRIVATE_REGISTRY_BUILD_CACHE" || "$CONNECT_TAILSCALE" != 'true' || "$PUBLISH_PRIVATE_REGISTRY" != 'true' ]]; then
          echo "No repository for docker build cache specified, disabling build cache all together."
          CACHE_FROM=""
          CACHE_TO=""
        else
          LAST_COMMIT_MSG=$(git log --oneline --no-merges -1)
          BUST_CACHE=false
          # shellcheck disable=SC2076  # literal substring match is intended; unquoting would make [ci: bust-cache] a regex character class
          if [[ "$LAST_COMMIT_MSG" =~ "[ci: bust-cache]" ]]; then
            echo "Instruction to bust cache detected in commit message."
            echo "Disabling use of cache for the build. This build itself will still be cached."
            BUST_CACHE=true
          fi

          if [[ "$BUST_CACHE" == 'true' ]]; then
            CACHE_FROM=""
          elif [[ -z "$VERSION_SEMVER" ]]; then
            echo "Setting cache-from to use main branch, current branch and last build of any branch as caches..."
            CACHE_FROM=$(printf 'type=registry,ref=%s:main\ntype=registry,ref=%s:branch-%s\ntype=registry,ref=%s:cache-latest' \
              "$IMAGE_CACHE" "$IMAGE_CACHE" "$VERSION_RAW" "$IMAGE_CACHE")
          else
            echo "Setting cache-from to use main branch and last build of any branch as caches..."
            CACHE_FROM=$(printf 'type=registry,ref=%s:main\ntype=registry,ref=%s:cache-latest' \
              "$IMAGE_CACHE" "$IMAGE_CACHE")
          fi

          if [[ -n "$VERSION_SEMVER" ]]; then
            # Tag builds only ever refresh cache-latest -- never clobber :main with a
            # point-in-time release build.
            echo "Setting cache-to to push to cache-latest only (tag build, leaving main cache untouched)..."
            CACHE_TO=$(printf 'type=registry,ref=%s:cache-latest,%s' "$IMAGE_CACHE" "$CACHE_PARAMS")
          elif [[ -n "$DEFAULT_BRANCH" && "$VERSION_RAW" == "$DEFAULT_BRANCH" ]]; then
            echo "Setting cache-to to push to main cache (default branch build)..."
            CACHE_TO=$(printf 'type=registry,ref=%s:main,%s\ntype=registry,ref=%s:cache-latest,%s' \
              "$IMAGE_CACHE" "$CACHE_PARAMS" "$IMAGE_CACHE" "$CACHE_PARAMS")
          else
            echo "Setting cache-to to push to branch cache..."
            CACHE_TO=$(printf 'type=registry,ref=%s:branch-%s,%s\ntype=registry,ref=%s:cache-latest,%s' \
              "$IMAGE_CACHE" "$VERSION_RAW" "$CACHE_PARAMS" "$IMAGE_CACHE" "$CACHE_PARAMS")
          fi
        fi

        set -x
        {
          echo "CACHE_FROM<<CACHE_FROM_EOF"
          echo "$CACHE_FROM"
          echo "CACHE_FROM_EOF"
          echo "CACHE_TO<<CACHE_TO_EOF"
          echo "$CACHE_TO"
          echo "CACHE_TO_EOF"
        } >> "$GITHUB_ENV"

    - name: Show build parameters
      shell: bash
      run: |
        env | sort | grep -E '^(CACHE_|VERSION_)'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        buildkitd-flags: '--debug --allow-insecure-entitlement=network.host'
        driver-opts: network=host
        platforms: ${{ inputs.platforms }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |-
          ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' && format('{0}/{1}', secrets.private_registry, inputs.private_registry_repository) || '' }}
          ${{ env.PUBLISH_DOCKERHUB == 'true' && inputs.dockerhub_repository || '' }}
        labels: |
          org.opencontainers.image.title=${{ inputs.label_title }}
          org.opencontainers.image.description=${{ inputs.label_description }}
          org.opencontainers.image.version=${{ env.VERSION_RAW }}
        annotations: |
          org.opencontainers.image.title=${{ inputs.label_title }}
          org.opencontainers.image.description=${{ inputs.label_description }}
          org.opencontainers.image.version=${{ env.VERSION_RAW }}
        tags: |-
          type=raw,value=${{ env.VERSION_RAW }},enable=${{ env.VERSION_SEMVER != '' }},priority=1000
          type=semver,pattern={{version}},value=${{ env.VERSION_SEMVER }},enable=${{ env.VERSION_SEMVER != '' }},priority=900
          type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION_SEMVER }},enable=${{ env.VERSION_SEMVER != '' }},priority=800
          type=semver,pattern={{major}},value=${{ env.VERSION_SEMVER }},enable=${{ env.VERSION_SEMVER != '' }},priority=700
          type=raw,value=latest,enable=${{ env.VERSION_SEMVER != '' }},priority=200
          type=raw,value=${{ env.VERSION_RAW }},enable=${{ env.REF_KIND == 'branch' }},prefix=branch-,priority=400
          type=raw,value=${{ env.VERSION_SHA }},prefix=git-,priority=300

    - name: Tailscale Connect
      if: ${{ env.CONNECT_TAILSCALE == 'true' }}
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ secrets.tailscale_oauth_client_id }}
        oauth-secret: ${{ secrets.tailscale_oauth_secret }}
        tags: tag:github-action-ci-runner

    - name: Tailscale Debug
      if: ${{ env.CONNECT_TAILSCALE == 'true' && github.event_name == 'workflow_dispatch' }}
      env:
        PRIVATE_REGISTRY: ${{ secrets.private_registry }}
      # yamllint disable-line rule:indentation
      run: |
        # .github/.output-filter is read from the CALLER's checkout (this is a reusable
        # workflow), so it is intentionally honoured when a consumer provides one, but must
        # not be required: GNU sed exits 4 on a missing script file, which would otherwise
        # fail this step's whole job for every consumer that doesn't ship one. Degrade to an
        # unfiltered passthrough instead -- this step is debug scaffolding, not something with
        # a correctness requirement beyond "runs and prints".
        output_filter() {
          if [[ -f .github/.output-filter ]]; then
            sed -f .github/.output-filter
          else
            cat
          fi
        }

        sudo -E tailscale netcheck --verbose 2>&1 | output_filter
        echo "------------------------------------------------------------------------------"
        sudo -E tailscale status 2>&1 | output_filter
        echo "------------------------------------------------------------------------------"
        sudo -E tailscale status --json --peers=false 2>&1 | output_filter
        echo "------------------------------------------------------------------------------"
        sudo tailscale dns status --all
        echo "------------------------------------------------------------------------------"
        sudo -E tailscale ping --verbose --until-direct=false --c 5 "$PRIVATE_REGISTRY" | output_filter
        echo "------------------------------------------------------------------------------"

    - name: Login to Docker Hub
      if: ${{ env.PUBLISH_DOCKERHUB == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.dockerhub_username }}
        password: ${{ secrets.dockerhub_token }}

    - name: Login to Private Registry
      if: ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ secrets.private_registry }}
        username: ${{ secrets.private_registry_username }}
        password: ${{ secrets.private_registry_token }}

    - name: Build and publish image
      id: build-image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ./${{ inputs.image_context_path }}
        platforms: ${{ inputs.platforms }}
        load: false
        push: ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' || env.PUBLISH_DOCKERHUB == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}
        no-cache: ${{ env.CACHE_FROM == '' && env.CACHE_TO == '' }}
        sbom: ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' || env.PUBLISH_DOCKERHUB == 'true' }}
        provenance: ${{ env.PUBLISH_PRIVATE_REGISTRY == 'true' || env.PUBLISH_DOCKERHUB == 'true' }}
        secrets: ${{ secrets.build_secrets }}

    - name: Prepare job outputs from image build
      id: image_info
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build-image.outputs.imageid }}
        IMAGE_TAG: ${{ steps.meta.outputs.version }}
        IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
      # yamllint disable-line rule:indentation
      run: |
        {
          echo "digest=${IMAGE_DIGEST}"
          echo "image_id=${IMAGE_ID}"
          echo "image_tag=${IMAGE_TAG}"
        } >> "$GITHUB_OUTPUT"

    - name: Docker Hub Description
      if: ${{ env.PUBLISH_DOCKERHUB == 'true' }}
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: ${{ secrets.dockerhub_username }}
        password: ${{ secrets.dockerhub_token }}
        repository: ${{ inputs.dockerhub_repository }}
        readme-filepath: ./${{ inputs.image_context_path }}/README.md
        short-description: ${{ inputs.label_description }}
        enable-url-completion: true

    - name: Tailscale Disconnect
      if: ${{ (success() || failure()) && (env.CONNECT_TAILSCALE == 'true') }}
      run: sudo -E tailscale logout
