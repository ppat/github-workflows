---
# yamllint disable rule:line-length
name: github-actions

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string
      files:
        required: false
        type: string
        default: 'ALL'
      mise_ignore_cfg:
        required: false
        type: string
        default: ""
      mise_log_level:
        required: false
        type: string
        default: "warn"

env:
  # renovate: datasource=github-releases depName=jdx/jactionlint
  JACTIONLINT_VERSION: "v2.5.0"
  # jactionlint shells out to this binary for the `shellcheck` rule; pin it so the
  # findings do not drift with whatever the runner image happens to ship.
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: "v0.11.0"

jobs:
  github-actions:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@66ed3b99f806f50f4e623d3d346f4ba37505ec68 # v2.12.0
      with:
        current_git_ref: ${{ inputs.git_ref }}
        current_repository: ${{ github.repository }}
        mise_ignore_cfg: ${{ inputs.mise_ignore_cfg }}
        mise_log_level: ${{ inputs.mise_log_level }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          jactionlint = "${{ env.JACTIONLINT_VERSION }}"
          shellcheck = "${{ env.SHELLCHECK_VERSION }}"

    - name: Lint github actions
      env:
        ACTIONS_FILES: ${{ inputs.files }}
      shell: bash
      working-directory: ./current
      # yamllint disable-line rule:indentation
      run: |
        # `--profile correctness` is actionlint's rule set plus jactionlint's bug detectors.
        # It leaves out the security and policy rules of jactionlint's default profile, which
        # overlap lint-zizmor.yaml. The flag wins over a `profile:` in the caller's
        # .github/jactionlint.yaml, so a caller cannot widen this gate, only turn rules off.
        #
        # jactionlint runs shellcheck with `--norc` unless the caller's config sets
        # `shellcheck.rcfile`, so a .shellcheckrc does not apply to `run:` blocks by default.
        # Handle findings there with inline `# shellcheck disable=` directives.
        #
        # An explicit `--shellcheck` makes a missing binary exit 3 instead of skipping
        # the rule with a note.
        if [[ "${ACTIONS_FILES}" == "ALL" ]]; then
          set -x
          jactionlint --profile correctness --shellcheck=shellcheck
          set +x
        else
          set -x
          # shellcheck disable=SC2086  # intentional word splitting: $ACTIONS_FILES is a space-separated file list
          jactionlint --profile correctness --shellcheck=shellcheck $ACTIONS_FILES
          set +x
        fi
