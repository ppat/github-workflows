---
# yamllint disable rule:line-length
name: update-aqua-checksums

on:
  workflow_call:
    inputs:
      aqua_dirs:
        required: true
        type: string
      git_ref:
        required: true
        type: string
      mise_ignore_cfg:
        required: false
        type: string
        default: ""
      mise_log_level:
        required: false
        type: string
        default: "warn"
      prune:
        required: false
        type: boolean
      semantic_commit_type:
        required: false
        type: string
        default: "chore"
      semantic_commit_scope:
        required: false
        type: string
        default: "dev-tools"
    secrets:
      app_client_id:
        required: true
      app_private_key:
        required: true

env:
  # renovate: datasource=github-releases depName=aquaproj/aqua
  AQUA_VERSION: "2.62.3"

jobs:
  update-aqua-checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Generate github app token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.app_client_id }}
        private-key: ${{ secrets.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.repository }}
        permission-contents: write

    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@f66c9acb40309305e0e1fd3179406b85647aa54c # v2.3.2
      with:
        current_fetch_depth: 0
        current_git_ref: ${{ inputs.git_ref }}
        current_repository: ${{ github.repository }}
        mise_ignore_cfg: ${{ inputs.mise_ignore_cfg }}
        mise_log_level: ${{ inputs.mise_log_level }}
        token: ${{ steps.app-token.outputs.token }}
        mise_toml: |
          [tools]
          aqua = "${{ env.AQUA_VERSION }}"

    - name: Update aqua-checksums.json
      env:
        AQUA_DIRS: ${{ inputs.aqua_dirs }}
        AQUA_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        PRUNE: "${{ inputs.prune && '-prune' || '' }}"
      shell: bash
      working-directory: ./current
      # yamllint disable-line rule:indentation
      run: |
        DIR_LIST=$(mktemp)
        if [[ "${AQUA_DIRS}" == "ALL" ]]; then
          find . -type f -name aqua.yaml -exec dirname {} \; | sort | uniq > "${DIR_LIST}"
        else
          # shellcheck disable=SC2086  # intentional word splitting: $AQUA_DIRS is a space-separated directory list
          echo ${AQUA_DIRS} | tr ' ' '\n' > "${DIR_LIST}"
        fi

        echo "Updating checksums..."
        while IFS= read -r dir; do
          echo "${dir}"
          pushd "${dir}" > /dev/null 2>&1
          # shellcheck disable=SC2086  # intentional: $PRUNE is a flag string that must vanish entirely when empty
          aqua update-checksum ${PRUNE} 2>&1 | pr -t -o 4
          popd > /dev/null 2>&1
          echo
        done < "${DIR_LIST}" | pr -t -o 4

        echo "Staging changes..."
        git add -A
        git status

    - name: Commit and push updated checksums
      uses: ppat/homelab-ops-actions/actions/create-signed-commit@f66c9acb40309305e0e1fd3179406b85647aa54c # v2.3.2
      with:
        branch: ${{ inputs.git_ref }}
        commit_message: "${{ inputs.semantic_commit_type }}(${{ inputs.semantic_commit_scope }}): update aqua checksums"
        repository: ${{ github.repository }}
        token: ${{ steps.app-token.outputs.token }}
        working_directory:  ./current
